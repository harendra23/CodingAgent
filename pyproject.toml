[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-agent"
version = "0.1.0"
description = "A modular AI coding agent service built with FastAPI and LangGraph."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "langgraph>=0.3,<2.0",
  "langchain-core>=0.3,<2.0",
  "langchain-openai>=0.3,<2.0",
  "langchain-anthropic>=0.3,<2.0",
  "langchain-google-genai>=2.0,<5.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "pgvector>=0.3,<1.0",
  "PyGithub>=2.5,<3.0",
  "atlassian-python-api>=3.41,<5.0",
  "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<2.0",
  "aiosqlite>=0.20,<1.0",
  "ruff>=0.9,<1.0",
  "mypy>=1.14,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_dev_agent = [
  "api/static/*.html",
  "skills/semantic_requirements_alignment/SKILL.md",
  "skills/agent_workflow/SKILL.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
extend-exclude = [".venv*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
